<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — PECK Fitness</title>
  <meta name="robots" content="noindex" />
  <!-- 404s are served from any URL depth, so set a base: "/peck-fitness/" on GitHub Pages project sites, "/" elsewhere -->
  <script>
    (function () {
      var seg = location.pathname.split('/')[1];
      var base = location.hostname.endsWith('github.io') && seg ? '/' + seg + '/' : '/';
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link rel="icon" href="favicon.ico?v=2" sizes="any" />
  <link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="terrain" style="min-height:100vh;display:flex;align-items:center;">
    <div class="wrap terrain-copy">
      <div class="eyebrow">Error 404</div>
      <h1>Off <span>course.</span></h1>
      <p>This trail doesn't go anywhere. Head back and find your footing.</p>
      <a class="button button-olive" href="./">Back to PECK <span class="arrow">↘</span></a>
    </div>
  </main>
</body>
</html>
